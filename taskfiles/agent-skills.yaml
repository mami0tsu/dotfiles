version: '3'

vars:
  agent_skills_dirs:
    - $HOME/.codex/skills
    - $HOME/.claude/skills
  apm_skills_install_args: --target agent-skills --only apm

tasks:
  clean:
    desc: Unlink APM-managed skills and remove generated APM files.
    cmds:
      - task: validate-generated-paths
      - task: unlink
      - |
        apm_skills_dir="{{.REPO_ROOT}}/.agents/skills"
        apm_modules_dir="{{.REPO_ROOT}}/apm_modules"

        if [[ -d "$apm_skills_dir" ]]; then
          rm -r "$apm_skills_dir"
        fi

        if [[ -d "$apm_modules_dir" ]]; then
          rm -r "$apm_modules_dir"
        fi
      - task: prune-stale-links

  deploy:
    desc: Materialize locked APM skills and link them into agent skill directories.
    cmds:
      - |
        source_dir="{{.REPO_ROOT}}/agents/skills"
        source_lock_file="$source_dir/apm.lock.yaml"
        staged_lock_file="{{.REPO_ROOT}}/apm.lock.yaml"

        if [[ ! -f "$source_lock_file" ]]; then
          echo "APM source lockfile does not exist: $source_lock_file" >&2
          exit 1
        fi

        if [[ -e "$staged_lock_file" || -L "$staged_lock_file" ]]; then
          echo "Refusing to overwrite an existing staged lockfile: $staged_lock_file" >&2
          exit 1
        fi

        temporary_lock_file="$(mktemp "{{.REPO_ROOT}}/.apm.lock.yaml.XXXXXX")"
        staged_lock_created=false

        cleanup() {
          if [[ "$staged_lock_created" == true ]]; then
            rm -f "$staged_lock_file"
          fi
          rm -f "$temporary_lock_file"
        }
        trap cleanup EXIT

        cp "$source_lock_file" "$temporary_lock_file"
        if ! ln "$temporary_lock_file" "$staged_lock_file"; then
          echo "Refusing to overwrite an existing staged lockfile: $staged_lock_file" >&2
          exit 1
        fi
        staged_lock_created=true

        task agent-skills:clean
        cd "$source_dir"
        apm install --root "{{.REPO_ROOT}}" {{.apm_skills_install_args}} --frozen
      - task: link

  lock:
    desc: Regenerate the APM lockfile from the skill manifest.
    dir: '{{.REPO_ROOT}}/agents/skills'
    cmds:
      - apm lock

  update:
    desc: Update locked APM skill dependencies without deploying them.
    dir: '{{.REPO_ROOT}}/agents/skills'
    cmds:
      - apm lock --update

  link:
    internal: true
    silent: true
    cmds:
      - task: validate-generated-paths
      - |
        apm_skills_dir="{{.REPO_ROOT}}/.agents/skills"

        if [[ ! -d "$apm_skills_dir" ]]; then
          echo "No APM skills were installed into $apm_skills_dir" >&2
          exit 1
        fi
      - for: { var: agent_skills_dirs, as: AGENT_SKILLS_DIR }
        task: link-into-agent-skills-dir
        vars:
          AGENT_SKILLS_DIR: '{{.AGENT_SKILLS_DIR}}'

  link-into-agent-skills-dir:
    internal: true
    silent: true
    cmds:
      - |
        apm_skills_dir="{{.REPO_ROOT}}/.agents/skills"
        agent_skills_dir="{{.AGENT_SKILLS_DIR}}"

        mkdir -p "$agent_skills_dir"

        shopt -s nullglob

        for apm_skill_dir in "$apm_skills_dir"/*/; do
          apm_skill_dir="${apm_skill_dir%/}"
          skill_name="$(basename "$apm_skill_dir")"
          agent_skill_dir="${agent_skills_dir}/${skill_name}"

          if [[ -e "$agent_skill_dir" && ! -L "$agent_skill_dir" ]]; then
            echo "Skill target exists and is not a symlink: $agent_skill_dir" >&2
            exit 1
          fi

          ln -sfn "$apm_skill_dir" "$agent_skill_dir"
        done

  unlink:
    internal: true
    silent: true
    cmds:
      - task: validate-generated-paths
      - for: { var: agent_skills_dirs, as: AGENT_SKILLS_DIR }
        task: unlink-from-agent-skills-dir
        vars:
          AGENT_SKILLS_DIR: '{{.AGENT_SKILLS_DIR}}'

  unlink-from-agent-skills-dir:
    internal: true
    silent: true
    cmds:
      - |
        apm_skills_dir="{{.REPO_ROOT}}/.agents/skills"
        agent_skills_dir="{{.AGENT_SKILLS_DIR}}"

        if [[ ! -d "$apm_skills_dir" ]]; then
          exit 0
        fi

        shopt -s nullglob

        for apm_skill_dir in "$apm_skills_dir"/*/; do
          apm_skill_dir="${apm_skill_dir%/}"
          skill_name="$(basename "$apm_skill_dir")"
          agent_skill_dir="${agent_skills_dir}/${skill_name}"

          if [[ -L "$agent_skill_dir" && "$(readlink "$agent_skill_dir")" == "$apm_skill_dir" ]]; then
            unlink "$agent_skill_dir"
          fi
        done

  prune-stale-links:
    internal: true
    silent: true
    cmds:
      - task: validate-generated-paths
      - for: { var: agent_skills_dirs, as: AGENT_SKILLS_DIR }
        task: prune-stale-links-from-agent-skills-dir
        vars:
          AGENT_SKILLS_DIR: '{{.AGENT_SKILLS_DIR}}'

  prune-stale-links-from-agent-skills-dir:
    internal: true
    silent: true
    cmds:
      - |
        apm_skills_dir="{{.REPO_ROOT}}/.agents/skills"
        agent_skills_dir="{{.AGENT_SKILLS_DIR}}"

        if [[ ! -d "$agent_skills_dir" ]]; then
          exit 0
        fi

        shopt -s nullglob

        for agent_skill_dir in "$agent_skills_dir"/*; do
          if [[ ! -L "$agent_skill_dir" ]]; then
            continue
          fi

          skill_target="$(readlink "$agent_skill_dir")"

          case "$skill_target" in
            "$apm_skills_dir"/*)
              if [[ ! -e "$skill_target" ]]; then
                unlink "$agent_skill_dir"
              fi
              ;;
          esac
        done

  validate-generated-paths:
    internal: true
    silent: true
    cmds:
      - |
        apm_dir="{{.REPO_ROOT}}/.agents"
        apm_skills_dir="$apm_dir/skills"
        apm_modules_dir="{{.REPO_ROOT}}/apm_modules"

        for generated_path in "$apm_dir" "$apm_skills_dir" "$apm_modules_dir"; do
          if [[ -L "$generated_path" ]]; then
            echo "Refusing to operate on a symlinked generated path: $generated_path" >&2
            exit 1
          fi
        done
