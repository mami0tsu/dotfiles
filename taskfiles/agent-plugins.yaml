version: '3'

vars:
  agent_plugin_marketplace_name: mami0tsu
  agent_plugin_legacy_marketplace_name: dotfiles
  dev_plugin_ref: 'dev@{{.agent_plugin_marketplace_name}}'
  doc_plugin_ref: 'doc@{{.agent_plugin_marketplace_name}}'
  mami0tsu_plugin_ref: 'mami0tsu@{{.agent_plugin_marketplace_name}}'
  development_plugin_ref: 'development@{{.agent_plugin_marketplace_name}}'
  documentation_plugin_ref: 'documentation@{{.agent_plugin_marketplace_name}}'
  development_plugin_legacy_ref: 'development@{{.agent_plugin_legacy_marketplace_name}}'
  documentation_plugin_legacy_ref: 'documentation@{{.agent_plugin_legacy_marketplace_name}}'
  agent_plugin_marketplace_dir: '{{.REPO_ROOT}}/agents/marketplaces/mami0tsu'
  dev_plugin_dir: '{{.agent_plugin_marketplace_dir}}/plugins/dev'
  doc_plugin_dir: '{{.agent_plugin_marketplace_dir}}/plugins/doc'

tasks:
  clean:
    desc: Uninstall all agent plugins and unregister the shared marketplace from Codex CLI and Claude Code.
    cmds:
      - task: clean:dev
      - task: clean:doc
      - task: clean:mami0tsu
      - task: codex:remove-marketplace-if-configured
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_marketplace_name}}'
      - task: claude:remove-marketplace-if-configured
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_marketplace_name}}'

  deploy:
    desc: Install all agent plugins in Codex CLI and Claude Code.
    cmds:
      - task: deploy:dev
      - task: deploy:doc
      - task: deploy:mami0tsu

  deploy:dev:
    desc: Deploy the dev plugin to Codex CLI and Claude Code.
    cmds:
      - task: clean:dev
      - task: deploy-plugin
        vars:
          PLUGIN_REF: '{{.dev_plugin_ref}}'

  deploy:doc:
    desc: Deploy the doc plugin to Codex CLI and Claude Code.
    cmds:
      - task: clean:doc
      - task: deploy-plugin
        vars:
          PLUGIN_REF: '{{.doc_plugin_ref}}'

  deploy:mami0tsu:
    desc: Deploy the mami0tsu plugin to Codex CLI and Claude Code.
    cmds:
      - task: clean:mami0tsu
      - task: deploy-plugin
        vars:
          PLUGIN_REF: '{{.mami0tsu_plugin_ref}}'

  migrate:
    desc: Remove legacy plugins and deploy the renamed plugins in Codex CLI and Claude Code.
    cmds:
      - task: codex:migrate
      - task: claude:migrate
      - task: deploy

  clean:dev:
    desc: Remove the dev plugin from Codex CLI and Claude Code.
    cmds:
      - task: clean-plugin
        vars:
          PLUGIN_REF: '{{.dev_plugin_ref}}'
      - task: clean-plugin
        vars:
          PLUGIN_REF: '{{.development_plugin_ref}}'

  clean:doc:
    desc: Remove the doc plugin from Codex CLI and Claude Code.
    cmds:
      - task: clean-plugin
        vars:
          PLUGIN_REF: '{{.doc_plugin_ref}}'
      - task: clean-plugin
        vars:
          PLUGIN_REF: '{{.documentation_plugin_ref}}'

  clean:mami0tsu:
    desc: Remove the mami0tsu plugin from Codex CLI and Claude Code.
    cmds:
      - task: clean-plugin
        vars:
          PLUGIN_REF: '{{.mami0tsu_plugin_ref}}'

  deploy-plugin:
    internal: true
    silent: true
    cmds:
      - task: codex:ensure-marketplace
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_marketplace_name}}'
          MARKETPLACE_DIR: '{{.agent_plugin_marketplace_dir}}'
      - task: claude:ensure-marketplace
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_marketplace_name}}'
          MARKETPLACE_DIR: '{{.agent_plugin_marketplace_dir}}'
      - task: codex:add-plugin
        vars:
          PLUGIN_REF: '{{.PLUGIN_REF}}'
      - task: claude:install-plugin
        vars:
          PLUGIN_REF: '{{.PLUGIN_REF}}'

  clean-plugin:
    internal: true
    silent: true
    cmds:
      - task: codex:remove-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.PLUGIN_REF}}'
      - task: claude:uninstall-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.PLUGIN_REF}}'

  claude:migrate:
    internal: true
    silent: true
    cmds:
      - task: claude:uninstall-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.development_plugin_legacy_ref}}'
      - task: claude:uninstall-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.documentation_plugin_legacy_ref}}'
      - task: claude:remove-marketplace-if-configured
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_legacy_marketplace_name}}'

  codex:migrate:
    internal: true
    silent: true
    cmds:
      - task: codex:remove-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.development_plugin_legacy_ref}}'
      - task: codex:remove-plugin-if-installed
        vars:
          PLUGIN_REF: '{{.documentation_plugin_legacy_ref}}'
      - task: codex:remove-marketplace-if-configured
        vars:
          MARKETPLACE_NAME: '{{.agent_plugin_legacy_marketplace_name}}'

  claude:ensure-marketplace:
    internal: true
    silent: true
    cmds:
      - |
        marketplace_name="{{.MARKETPLACE_NAME}}"
        marketplace_dir="{{.MARKETPLACE_DIR}}"
        marketplace_list="$(claude plugin marketplace list)"
        marketplace_configured=false
        if printf '%s\n' "$marketplace_list" | grep -Eq "^[[:space:]]*[^[:space:]]?[[:space:]]*${marketplace_name}$"; then
          marketplace_configured=true
        fi
        marketplace_root="$(printf '%s\n' "$marketplace_list" | awk -v name="$marketplace_name" '
          $0 ~ "^[[:space:]]*[^[:space:]]?[[:space:]]*" name "$" { found = 1; next }
          found && $0 ~ /^[[:space:]]*Source: Directory \(/ {
            sub(/^.*Source: Directory \(/, "")
            sub(/\).*$/, "")
            print
            exit
          }
        ')"

        if [[ "$marketplace_configured" == true && "$marketplace_root" != "$marketplace_dir" ]]; then
          claude plugin marketplace remove "$marketplace_name"
          marketplace_configured=false
          marketplace_root=""
        fi

        if [[ "$marketplace_configured" == false ]]; then
          claude plugin marketplace add "$marketplace_dir"
        fi

  claude:install-plugin:
    internal: true
    silent: true
    cmds:
      - |
        plugin_ref="{{.PLUGIN_REF}}"
        claude plugin install "$plugin_ref"

  claude:remove-marketplace-if-configured:
    internal: true
    silent: true
    cmds:
      - |
        marketplace_name="{{.MARKETPLACE_NAME}}"
        marketplace_list="$(claude plugin marketplace list)"

        if printf '%s\n' "$marketplace_list" | grep -Eq "^[[:space:]]*[^[:space:]]?[[:space:]]*${marketplace_name}$"; then
          claude plugin marketplace remove "$marketplace_name"
        fi

  claude:uninstall-plugin-if-installed:
    internal: true
    silent: true
    cmds:
      - |
        plugin_ref="{{.PLUGIN_REF}}"
        plugin_list="$(claude plugin list --json)"

        if printf '%s\n' "$plugin_list" | grep -Fq "\"id\": \"$plugin_ref\""; then
          claude plugin uninstall "$plugin_ref" --yes
        fi

  codex:ensure-marketplace:
    internal: true
    silent: true
    cmds:
      - |
        marketplace_name="{{.MARKETPLACE_NAME}}"
        marketplace_dir="{{.MARKETPLACE_DIR}}"
        if ! marketplace_list="$(codex plugin marketplace list)"; then
          codex plugin marketplace remove "$marketplace_name"
          codex plugin marketplace add "$marketplace_dir"
          exit 0
        fi
        marketplace_root="$(printf '%s\n' "$marketplace_list" | awk -v name="$marketplace_name" '$1 == name { print $2; exit }')"

        if [[ -n "$marketplace_root" && "$marketplace_root" != "$marketplace_dir" ]]; then
          codex plugin marketplace remove "$marketplace_name"
          marketplace_root=""
        fi

        if [[ -z "$marketplace_root" ]]; then
          codex plugin marketplace add "$marketplace_dir"
        fi

  codex:add-plugin:
    internal: true
    silent: true
    cmds:
      - |
        plugin_ref="{{.PLUGIN_REF}}"
        codex plugin add "$plugin_ref"

  codex:remove-marketplace-if-configured:
    internal: true
    silent: true
    cmds:
      - |
        marketplace_name="{{.MARKETPLACE_NAME}}"
        marketplace_list="$(codex plugin marketplace list)"

        if printf '%s\n' "$marketplace_list" | awk 'NR > 1 { print $1 }' | grep -Fxq "$marketplace_name"; then
          codex plugin marketplace remove "$marketplace_name"
        fi

  codex:remove-plugin-if-installed:
    internal: true
    silent: true
    cmds:
      - |
        plugin_ref="{{.PLUGIN_REF}}"
        plugin_list="$(codex plugin list --json)"

        if printf '%s\n' "$plugin_list" | grep -Fq "\"pluginId\": \"$plugin_ref\""; then
          codex plugin remove "$plugin_ref"
        fi
