---
name: YAML Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.y{a,}ml'
      - flake.lock
      - flake.nix
      - nix/packages/**
  push:
    branches: [main]
    paths:
      - '**/*.y{a,}ml'
      - flake.lock
      - flake.nix
      - nix/packages/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Lint YAML
        run: nix develop .#lint -c yamllint --config-file .github/yamllint.yaml --strict .
