---
name: Workflow Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/ghalint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/ghalint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Lint workflows with ghalint
        run: nix develop .#lint -c ghalint run

      - name: Lint workflows with actionlint
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          actionlint_flags: .github/workflows/*.yaml
          fail_level: error

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github
          online-audits: false
          min-severity: low
          version: 1.27.0
          advanced-security: false
