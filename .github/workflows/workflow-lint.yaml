---
name: Workflow Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - .github/jactionlint.yaml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/jactionlint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - .github/jactionlint.yaml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/jactionlint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Lint workflows with jactionlint
        run: nix develop .#lint -c jactionlint --format github --strict-exit
