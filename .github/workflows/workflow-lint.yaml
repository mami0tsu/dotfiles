---
name: Workflow Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/ghalint.nix
  push:
    branches: [main]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/ghalint.nix

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Lint workflows with ghalint
        run: nix develop .#lint -c ghalint run

      - name: Lint workflows with actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          actionlint_flags: .github/workflows/*.yaml
          fail_level: error

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github
          online-audits: false
          min-severity: low
          version: 1.27.0
          advanced-security: false
