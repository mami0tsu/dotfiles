---
name: Renovate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
  push:
    branches: [main]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
  workflow_dispatch:
  schedule:
    # 毎週月曜日 09:00 JST に実行する
    - cron: '0 0 * * 1'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Renovate Config
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Build and test Nix hash action
        working-directory: .github/actions/update-nix-hashes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run build
          git diff --exit-code -- dist
          pnpm test

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run Nix hash action
        # このチェックアウトで再ビルドしたアクションを検証する
        uses: ./.github/actions/update-nix-hashes # zizmor: ignore[self-repository]

      - name: Validate Renovate Config
        run: nix shell nixpkgs#renovate -c renovate-config-validator renovate.json

  renovate:
    name: Renovate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          # postUpgradeTasks.installTools で Nix を導入できる標準イメージを使う
          renovate-version: latest
          token: ${{ steps.app-token.outputs.token }}
        env:
          # postUpgradeTasks では Nix hash の更新とアクションのビルドだけを許可する
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^node \\.github/actions/update-nix-hashes/dist/index\\.js$",
             "^pnpm --dir \\.github/actions/update-nix-hashes (install --frozen-lockfile --ignore-scripts|run build)$"]
          # postUpgradeTasks で宣言した Nix を実行時に導入する
          RENOVATE_BINARY_SOURCE: install
          # self-hosted Renovate では、このリポジトリの設定ファイルだけを実行対象にする
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
