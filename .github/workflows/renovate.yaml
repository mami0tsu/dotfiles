---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜日 09:00 JST に実行する
    - cron: '0 0 * * 1'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          # Renovate コンテナへ渡す既定の環境変数に NIX_CONFIG を加える
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy|NIX_CONFIG)$'
          renovate-version: full
          token: ${{ steps.app-token.outputs.token }}
        env:
          # renovate.json の postUpgradeTasks で使う Nix hash 更新スクリプトだけを許可する
          RENOVATE_ALLOWED_COMMANDS: '["^\\.github/renovate-update-nix-hashes\\.sh$"]'
          # postUpgradeTasks の Nix コマンドで必要な experimental features を有効にする
          NIX_CONFIG: |
            experimental-features = nix-command flakes
          # self-hosted Renovate では、このリポジトリの設定ファイルだけを実行対象にする
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
