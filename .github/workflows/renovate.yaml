---
# Renovate の設定と更新処理を検証し 定期実行または手動実行で依存更新の PR を作成する
name: Renovate

# PR と main への push は設定検証、定期実行と手動実行は依存更新に使う
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
  push:
    branches: [main]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
  workflow_dispatch:
  schedule:
    # 毎週月曜日 09:00 JST に実行する
    - cron: '0 0 * * 1'

# 権限はジョブごとに必要なものだけを付与する
permissions: {}

defaults:
  run:
    shell: bash

# 設定検証と依存更新が互いをキャンセルしないようイベント別にまとめる
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR では App の認証情報を使わず、設定と更新アクションを検証する
  validate:
    name: Validate Renovate Config
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      # dist の再ビルド結果がコミット済みの成果物と一致することも確認する
      - name: Build and test Nix hash action
        working-directory: .github/actions/update-nix-hashes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run build
          git diff --exit-code -- dist
          pnpm test

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run Nix hash action
        # このチェックアウトで再ビルドしたアクションを検証する
        uses: ./.github/actions/update-nix-hashes # zizmor: ignore[self-repository]

      - name: Validate Renovate Config
        run: nix shell nixpkgs#renovate -c renovate-config-validator renovate.json

  # 依存更新と PR 作成は定期実行または明示的な手動実行に限定する
  renovate:
    name: Renovate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ワークフローを含む依存更新を、このリポジトリに限定した App トークンで行う
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.21
        with:
          # postUpgradeTasks.installTools で Nix を導入できる標準イメージを使う
          renovate-version: latest
          token: ${{ steps.app-token.outputs.token }}
        env:
          # postUpgradeTasks ではハッシュ更新、ビルド、公式 CLI による lockfile 更新を許可する
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^node \\.github/actions/update-nix-hashes/dist/index\\.js$",
             "^install-tool gh 2\\.103\\.3$",
             "^gh extension install github/gh-actions-lock --pin v0\\.4\\.1$",
             "^gh actions-lock --ignore-local-actions --no-interactive$",
             "^pnpm --dir \\.github/actions/update-nix-hashes (install --frozen-lockfile --ignore-scripts|run build)$"]
          # postUpgradeTasks で宣言した Nix を実行時に導入する
          RENOVATE_BINARY_SOURCE: install
          # lockfile の再生成で公開アクションを取得するために App トークンを渡す
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"GH_TOKEN": ${{ toJSON(steps.app-token.outputs.token) }}}
          # self-hosted Renovate では、このリポジトリの設定ファイルだけを実行対象にする
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REQUIRE_CONFIG: required
