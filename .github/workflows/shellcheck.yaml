# Git 管理下のシェルスクリプトを ShellCheck で検証する
name: ShellCheck

# シェルスクリプトと lint 環境の変更を検証する
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.sh'
      - .github/workflows/shellcheck.yaml
      - flake.lock
      - flake.nix
      - nix/packages/**
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - .github/workflows/shellcheck.yaml
      - flake.lock
      - flake.nix
      - nix/packages/**

# ワークフローレベルではパーミッションを設定しない
permissions: {}

# デフォルトシェルでパイプエラーを有効化する
defaults:
  run:
    shell: bash

# ワークフローが同じブランチで複数起動したらキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Git 管理下の .sh を対象にし、従来どおり error レベルで失敗させる
      # NUL 区切りで空白を含むファイル名に対応し、対象がなければ実行しない
      - name: Run ShellCheck
        run: |
          git ls-files -z -- '*.sh' |
            xargs -0 -r nix develop .#lint -c shellcheck --severity=error --
