---
name: Taskfile Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**
  push:
    branches: [main]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  taskfile:
    name: Taskfile Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.40.1

      - name: Test Taskfile
        run: task validate:taskfile
