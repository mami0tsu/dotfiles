---
# Taskfile と読み込むタスク定義をリポジトリの検証タスクで確認する
name: Taskfile Test

# Taskfile と読み込むタスク定義の変更を検証する
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**
  push:
    branches: [main]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**

# 権限はジョブごとに必要なものだけを付与する
permissions: {}

# 同じ PR またはブランチの古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  taskfile:
    name: Taskfile Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@v2.2.0
        with:
          version: 3.40.1

      # リポジトリで定義した Taskfile 検証タスクを実行する
      - name: Test Taskfile
        run: task validate:taskfile
