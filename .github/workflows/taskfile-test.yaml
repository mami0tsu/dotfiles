---
name: Taskfile Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**
  push:
    branches: [main]
    paths:
      - .github/workflows/taskfile-test.yaml
      - taskfile.yaml
      - taskfiles/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  taskfile:
    name: Taskfile Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.40.1

      - name: Test Taskfile
        run: task validate:taskfile
