---
# GitHub Actions のワークフローとローカルアクションを jactionlint で検証する
name: jactionlint

# ワークフロー、ローカルアクション、lint 環境の変更を検証する
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - .github/jactionlint.yaml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/jactionlint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/**/*.y{a,}ml
      - .github/**/action.y{a,}ml
      - .github/jactionlint.yaml
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/jactionlint.nix
      - nix/packages/textlint.nix
      - .github/textlint/**
      - package.json

# 権限はジョブごとに必要なものだけを付与する
permissions: {}

# 同じ PR またはブランチの古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: jactionlint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Nix で固定したツールを使い、診断を GitHub の注釈として出力する
      - name: jactionlint
        run: nix develop .#lint -c jactionlint --format github --strict-exit
