---
name: Renovate Config Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate-config-validate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
  push:
    branches: [main]
    paths:
      - .github/actions/update-nix-hashes/**
      - .github/workflows/renovate-config-validate.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Build and test Nix hash action
        working-directory: .github/actions/update-nix-hashes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run build
          git diff --exit-code -- dist
          pnpm test

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run Nix hash action
        # このチェックアウトで再ビルドしたアクションを検証する
        uses: ./.github/actions/update-nix-hashes # zizmor: ignore[self-repository]

      - name: Validate Renovate Config
        run: nix shell nixpkgs#renovate -c renovate-config-validator renovate.json
