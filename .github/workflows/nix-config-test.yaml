---
# CI 用の macOS 構成をビルドし flake に定義したチェックを実行する
name: Nix Config Test

# Nix 設定と依存の変更を macOS 上でビルドして検証する
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/nix-config-test.yaml
      - flake.lock
      - flake.nix
      - nix/**
      - package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/nix-config-test.yaml
      - flake.lock
      - flake.nix
      - nix/**
      - package.json

# ワークフローレベルではパーミッションを設定しない
permissions: {}

# デフォルトシェルでパイプエラーを有効化する
defaults:
  run:
    shell: bash

# ワークフローが同じブランチで複数起動したらキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # GitHub Actions キャッシュは main への push 時だけ有効にする
      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-gha-cache: ${{ github.event_name == 'push' && 'enabled' || 'disabled' }}
          use-flakehub: disabled

      # CI 用の構成をビルドし、ロックファイルを更新せずに検証する
      - name: Build Darwin Configuration
        run: nix build --no-link --no-update-lock-file --print-build-logs .#darwinConfigurations.ci.system

      # flake に定義したパッケージのスモークテストと構文チェックも実行する
      - name: Run Flake Checks
        run: nix flake check --no-update-lock-file
