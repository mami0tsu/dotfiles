---
# Git 管理下の Markdown を共通の文章校正ルールに従って textlint で検証する
name: textlint

# Markdown と文章校正ルール、lint 環境の変更を PR で検証する
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.md'
      - .github/workflows/textlint.yaml
      - .github/textlint/**
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/textlint.nix
      - package.json

# ワークフローレベルではパーミッションを設定しない
permissions: {}

# デフォルトシェルでパイプエラーを有効化する
defaults:
  run:
    shell: bash

# ワークフローが同じブランチで複数起動したらキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: textlint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Git 管理下の Markdown を、校正設定のディレクトリから参照できるパスに変換する
      # ファイル名は NUL 区切りで渡し、空白を含むパスでも分割しない
      - name: textlint
        working-directory: .github/textlint
        run: |
          git -C ../.. ls-files -z -- '*.md' |
            while IFS= read -r -d '' file; do
              printf '../../%s\0' "$file"
            done |
            xargs -0 nix develop '../..#lint' -c textlint \
              --config .textlintrc.json \
              --ignore-path .textlintignore \
              --
