---
name: Textlint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.md'
      - .github/workflows/textlint.yaml
      - .github/textlint/**
      - flake.lock
      - flake.nix
      - nix/packages/default.nix
      - nix/packages/textlint.nix

# ワークフローレベルではパーミッションを設定しない
permissions: {}

# デフォルトシェルでパイプエラーを有効化する
defaults:
  run:
    shell: bash

# ワークフローが同じブランチで複数起動したらキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Lint Markdown
        working-directory: .github/textlint
        run: |
          git -C ../.. ls-files -z -- '*.md' |
            while IFS= read -r -d '' file; do
              printf '../../%s\0' "$file"
            done |
            xargs -0 nix develop '../..#lint' -c textlint \
              --config .textlintrc.json \
              --ignore-path .textlintignore \
              --
